<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b50" />
    <title>Atualizando Nutri+</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f2ea; color: #173d34; font: 16px system-ui, sans-serif; }
      main { width: min(88vw, 360px); padding: 32px; border: 1px solid #d8dfdb; border-radius: 24px; background: #fff; text-align: center; box-shadow: 0 18px 50px rgba(23, 61, 52, .08); }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #5b6f69; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <h1>Atualizando o Nutri+</h1>
      <p>Limpando a versão antiga para abrir o aplicativo novamente.</p>
    </main>
    <script>
      (async () => {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        location.replace('/?pwa-reset=' + Date.now());
      })().catch(() => location.replace('/?pwa-reset=' + Date.now()));
    </script>
  </body>
</html>
