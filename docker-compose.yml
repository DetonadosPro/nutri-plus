name: nutriplus

services:
  database:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutriplus}
      POSTGRES_USER: ${POSTGRES_USER:-nutriplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutriplus}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-nutriplus}
      NUTRI_ALLOW_REMOTE_DATABASE: "true"
      NUTRI_ENV: ${NUTRI_ENV:-development}
      NODE_ENV: ${NUTRI_ENV:-development}
      NUTRI_API_PORT: 3001
      NUTRI_API_HOST: "0.0.0.0"
      NUTRI_APP_URL: ${NUTRI_APP_URL:-http://localhost:8080}
      NUTRI_SMTP_HOST: ${NUTRI_SMTP_HOST:-}
      NUTRI_SMTP_PORT: ${NUTRI_SMTP_PORT:-587}
      NUTRI_SMTP_USER: ${NUTRI_SMTP_USER:-}
      NUTRI_SMTP_PASSWORD: ${NUTRI_SMTP_PASSWORD:-}
      NUTRI_EMAIL_FROM: ${NUTRI_EMAIL_FROM:-}
      NUTRI_EMAIL_REPLY_TO: ${NUTRI_EMAIL_REPLY_TO:-}
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  database-init:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: "no"
    command: ["sh", "-c", "npx tsx backend/taco-import.ts && npx tsx backend/ig-import.ts"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nutriplus}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-nutriplus}
      NUTRI_ALLOW_REMOTE_DATABASE: "true"
      NUTRI_ENV: container
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NUTRI_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
