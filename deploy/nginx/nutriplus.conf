server {
    listen 80;
    listen [::]:80;
    server_name nutriplusapp.store www.nutriplusapp.store pro.nutriplusapp.store admin.nutriplusapp.store;
    return 301 https://nutriplusapp.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nutriplusapp.store pro.nutriplusapp.store admin.nutriplusapp.store;

    ssl_certificate /etc/letsencrypt/live/nutriplusapp.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutriplusapp.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nutriplusapp.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nutriplusapp.store;

    ssl_certificate /etc/letsencrypt/live/nutriplusapp.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutriplusapp.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
