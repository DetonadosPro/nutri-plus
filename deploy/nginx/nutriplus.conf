server {
    listen 80;
    listen [::]:80;
    server_name nutriplusapp.store www.nutriplusapp.store pro.nutriplusapp.store admin.nutriplusapp.store;
    return 301 https://nutriplusapp.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nutriplusapp.store pro.nutriplusapp.store admin.nutriplusapp.store;

    ssl_certificate /etc/letsencrypt/live/nutriplusapp.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutriplusapp.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nutriplusapp.store$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nutriplusapp.store;

    ssl_certificate /etc/letsencrypt/live/nutriplusapp.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nutriplusapp.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /api/foods/recognize {
        client_max_body_size 5M;
        proxy_read_timeout 100s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(manifest\.webmanifest|offline\.html|reset-pwa\.html)$ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/static/ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, must-revalidate" always;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
